<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Head Crusher">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Head Crusher</title>
<style>
  :root {
    --red: #ff3b30; --yellow: #ffe14d; --ink: #0b0b0c; --paper: #ffffff;
    --glass: rgba(18,18,20,.55); --line: rgba(255,255,255,.18);
    --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    width: 100%; height: 100dvh; overflow: hidden; background: #000; color: #fff;
    touch-action: none; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; touch-action: manipulation; cursor: pointer; }

  #stage { position: fixed; inset: 0; }
  #stage.shake { animation: shake .28s linear; }
  @keyframes shake {
    0% { transform: translate(0,0); } 20% { transform: translate(-7px,4px); } 40% { transform: translate(6px,-5px); }
    60% { transform: translate(-4px,-3px); } 80% { transform: translate(3px,4px); } 100% { transform: translate(0,0); }
  }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirrored { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* score */
  #score {
    position: fixed; top: calc(var(--top) + 10px); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 18px 8px;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
  }
  #pts { font-size: 54px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; transition: transform .12s ease; }
  #pts.pop { transform: scale(1.28); }
  #sub { font-size: 13px; font-weight: 600; opacity: .85; margin-top: 3px; white-space: nowrap; }
  #combo {
    position: fixed; top: calc(var(--top) + 96px); left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 18px;
    padding: 4px 12px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #debug {
    position: fixed; left: 10px; top: calc(var(--top) + 8px);
    color: rgba(255,255,255,.5); font-size: 10px; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none;
  }

  /* bottom controls */
  #hint {
    position: fixed; left: 78px; right: 78px; bottom: calc(var(--bot) + 84px);
    text-align: center; font-size: 14px; font-weight: 700; line-height: 1.25;
    text-shadow: 0 1px 8px rgba(0,0,0,.9); pointer-events: none;
  }
  .round {
    position: fixed; bottom: calc(var(--bot) + 68px); width: 52px; height: 52px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: grid; place-items: center;
  }
  .round svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #sound { left: 14px; } #flip { right: 14px; }
  #zoneBtn { right: 14px; bottom: calc(var(--bot) + 132px); }

  /* crush zone editor: drag the edges like a crop */
  #zoneEdit { position: fixed; inset: 0; z-index: 7; touch-action: none; }
  #zoneBox {
    position: absolute; border: 2px solid var(--yellow); border-radius: 14px;
    box-shadow: 0 0 0 200vmax rgba(0,0,0,.55);
  }
  #zoneBox .grip { position: absolute; background: var(--yellow); border-radius: 999px; touch-action: none; }
  #zoneBox .grip::after { content: ""; position: absolute; inset: -22px; } /* a big finger target */
  #zoneBox .g-top, #zoneBox .g-bottom { left: 50%; width: 64px; height: 8px; margin-left: -32px; }
  #zoneBox .g-top { top: -5px; } #zoneBox .g-bottom { bottom: -5px; }
  #zoneBox .g-left, #zoneBox .g-right { top: 50%; width: 8px; height: 64px; margin-top: -32px; }
  #zoneBox .g-left { left: -5px; } #zoneBox .g-right { right: -5px; }
  #zoneLabel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
    font-size: 15px; font-weight: 800; line-height: 1.35; text-shadow: 0 1px 8px rgba(0,0,0,.9); pointer-events: none; white-space: nowrap;
  }
  #zoneLabel small { display: block; font-size: 12px; font-weight: 600; opacity: .8; }
  #zoneBar {
    position: fixed; left: 0; right: 0; bottom: calc(var(--bot) + 14px); z-index: 8;
    display: flex; justify-content: center; gap: 10px;
  }
  #zoneBar button { padding: 13px 22px; border-radius: 999px; font-size: 15px; font-weight: 800; background: var(--glass); border: 1px solid var(--line); }
  #zoneBar #zoneDone { background: var(--paper); color: var(--ink); }
  #sound.off .wave { display: none; } #sound:not(.off) .mute { display: none; }
  #pills {
    position: fixed; left: 0; right: 0; bottom: calc(var(--bot) + 12px);
    display: flex; justify-content: center; flex-wrap: nowrap; gap: 5px; padding: 0 8px;
  }
  #pills button {
    padding: 10px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #pills button.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  /* day sheet */
  #sheet {
    position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  #sheetCard {
    width: 100%; max-width: 460px; background: #151517; border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(var(--bot) + 18px); border-top: 1px solid var(--line);
  }
  #sheetCard h2 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  #bestLine { font-size: 13px; opacity: .7; margin-bottom: 12px; }
  #days { list-style: none; display: grid; gap: 2px; margin-bottom: 14px; }
  #days li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; font-variant-numeric: tabular-nums; }
  #days li.today { font-weight: 800; }
  #days .h { opacity: .65; } #days .p { min-width: 64px; text-align: right; }
  .sheetBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheetBtns button { padding: 13px 10px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 14px; font-weight: 700; }
  .sheetBtns #closeSheet { grid-column: 1 / -1; background: var(--paper); color: var(--ink); }

  /* start */
  #start {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 30px 26px; text-align: center;
  }
  #start svg { width: 132px; height: 132px; }
  #start h1 { font-size: 46px; font-weight: 900; letter-spacing: -2px; line-height: .95; text-transform: uppercase; }
  #start h1 span { color: var(--red); }
  #start p { color: rgba(255,255,255,.72); font-size: 16px; line-height: 1.4; max-width: 300px; }
  #startStats { font-size: 14px; font-weight: 700; color: var(--yellow); min-height: 18px; }
  #startBtn { margin-top: 6px; padding: 17px 54px; border-radius: 999px; background: var(--red); color: #fff; font-size: 21px; font-weight: 800; }
  #startBtn:disabled { opacity: .45; }
  #banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b00020; color: #fff;
    font-size: 14px; line-height: 1.4; padding: calc(var(--top) + 12px) 16px 12px;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button id="score" type="button" aria-label="Open today's points">
  <span id="pts">0</span>
  <span id="sub">Crushed today: 0</span>
</button>
<div id="combo" hidden></div>
<div id="debug"></div>

<div id="hint"></div>
<button id="sound" class="round" type="button" aria-label="Sound">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<button id="flip" class="round" type="button" aria-label="Flip camera">
  <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
</button>
<button id="zoneBtn" class="round" type="button" aria-label="Set the crush zone">
  <svg viewBox="0 0 24 24"><path d="M6 2v16h16"/><path d="M2 6h16v16"/></svg>
</button>
<div id="zoneEdit" hidden>
  <div id="zoneBox">
    <div class="grip g-top" data-edge="top"></div><div class="grip g-bottom" data-edge="bottom"></div>
    <div class="grip g-left" data-edge="left"></div><div class="grip g-right" data-edge="right"></div>
    <div id="zoneLabel"></div>
  </div>
  <div id="zoneBar">
    <button id="zoneReset" type="button">Reset</button>
    <button id="zoneDone" type="button">Done</button>
  </div>
</div>
<div id="pills">
  <button type="button" data-fx="squish">Crush</button>
  <button type="button" data-fx="boom">Explode</button>
  <button type="button" data-fx="eyes">Eyes</button>
  <button type="button" data-fx="confetti">Confetti</button>
  <button type="button" data-fx="mix">Mix</button>
</div>

<div id="sheet" hidden>
  <div id="sheetCard">
    <h2>Your week</h2>
    <div id="bestLine"></div>
    <ul id="days"></ul>
    <div class="sheetBtns">
      <button id="resetDay" type="button">Reset today</button>
      <button id="trackMode" type="button">Tracking</button>
      <button id="closeSheet" type="button">Back to crushing</button>
    </div>
  </div>
</div>

<div id="banner" hidden></div>

<div id="start">
  <svg viewBox="0 0 132 132" aria-hidden="true">
    <circle cx="66" cy="66" r="24" fill="none" stroke="#ff3b30" stroke-width="5"/>
    <circle cx="58" cy="62" r="3" fill="#fff"/><circle cx="74" cy="62" r="3" fill="#fff"/>
    <path d="M57 76q9 6 18 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 4v26M66 128v-26" stroke="#ffe14d" stroke-width="9" stroke-linecap="round"/>
    <path d="M56 22l10 10 10-10M56 110l10-10 10 10" fill="none" stroke="#ffe14d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Head <span>Crusher</span></h1>
  <p>Aim the back camera at a person, a pet, a horse or a car. Hold one hand out in the middle of the view and crush it between your fingers.</p>
  <div id="startStats"></div>
  <button id="startBtn" type="button" disabled>Loading</button>
</div>

<script type="module">
import { FaceDetector, HandLandmarker, ObjectDetector, FilesetResolver } from "./assets/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const stage = $("stage"), video = $("cam"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const ptsEl = $("pts"), subEl = $("sub"), comboEl = $("combo"), debugEl = $("debug"), hintEl = $("hint");
const banner = $("banner"), startScreen = $("start"), startBtn = $("startBtn");

const params = new URLSearchParams(location.search);
const FORCE_CPU = params.has("cpu");
const TEST_SRC = params.get("src"); // test only: play a still image as the camera

// ---------- tuning ----------
const PINCH_CLOSE = 0.30;      // finger gap under this share of hand size counts as closed
const PINCH_OPEN = 0.50;       // gap over this share re-arms the pinch
const FACE_PERSIST_MS = 900;   // a target stays crushable this long after the hand covers it
const COOLDOWN_MS = 700;       // rest time before the same target scores again
const COMBO_WINDOW_MS = 4000;  // hits inside this window chain a combo
const FAR_RATIO = 0.16, LONG_RATIO = 0.08; // face width as a share of the short screen side

// Only a hand whose fingertips are inside the crush zone can crush. Hands resting in the dead zones
// at the edges are ignored. Each edge is a share of the screen, and the player can drag them in the app.
const ZONE_DEFAULT = { top: 0.15, bottom: 0.25, left: 0.10, right: 0.10 };
const ZONE_MIN = 0.2;          // the zone never gets narrower or shorter than this share of the screen
const ZONE_KEEP = 0.06;        // the crusher may drift this much past the box before it lets go
const CRUSHER_LOST_MS = 350;   // after this long without the crusher, another hand may take over
const MOVING_SPEED = 0.18;     // a target moving faster than this share of the short side per second is "moving"

// what can be crushed, and what each is worth
const KINDS = {
  head:   { pts: 100, color: "#ff3b30" },
  animal: { pts: 150, color: "#ff9f0a" },
  car:    { pts: 200, color: "#0a84ff" },
};
const OBJECT_KINDS = {
  cat: "animal", dog: "animal", horse: "animal", sheep: "animal", cow: "animal", bird: "animal",
  bear: "animal", zebra: "animal", giraffe: "animal", elephant: "animal",
  car: "car", truck: "car", bus: "car", motorcycle: "car",
};

const RED = "#ff3b30", YELLOW = "#ffe14d";
const CONFETTI = ["#ff3b30", "#ffe14d", "#34c759", "#0a84ff", "#ff9f0a", "#bf5af2", "#ffffff"];

// ---------- saved state ----------
const DAY_KEY = "headcrusher.days.v1", PREF_KEY = "headcrusher.prefs.v1";
const OLD_DAY_KEY = "headpinch.days.v1", OLD_PREF_KEY = "headpinch.prefs.v1"; // scores from the Head Pinch days carry over
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let days = readJSON(DAY_KEY, null) || readJSON(OLD_DAY_KEY, {});
let prefs = Object.assign({ fx: "mix", sound: true }, readJSON(PREF_KEY, null) || readJSON(OLD_PREF_KEY, {}));
prefs.zone = Object.assign({}, ZONE_DEFAULT, prefs.zone || {});

const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function today() {
  const k = dayKey();
  if (!days[k]) days[k] = { pts: 0, heads: 0, combo: 0 };
  return days[k];
}
function saveDays() {
  const keys = Object.keys(days).sort();
  while (keys.length > 120) delete days[keys.shift()];
  writeJSON(DAY_KEY, days);
}
function bestDay() {
  let best = null;
  for (const [k, v] of Object.entries(days)) if (v.pts > 0 && (!best || v.pts > best.pts)) best = { key: k, ...v };
  return best;
}
const fmt = n => Math.round(n).toLocaleString();
const heads = n => `${fmt(n)} ${n === 1 ? "crush" : "crushes"}`;

// ---------- game state ----------
let faceFull, faceShort, handLandmarker, objectDetector = null, handDelegate = "GPU";
let stream = null, facing = "environment", mirrored = false;
let started = false, running = false, loopToken = 0;
let W = 0, H = 0, DPR = 1, T = null;
let faces = [], objects = [], nextFaceId = 1;
// one crusher at a time: the hand that is locked on, and its finger state
const pinch = { closed: false, armed: false, hand: null, lastSeen: 0, locked: false };
let otherHands = 0, editingZone = false;
let combo = 0, lastHitAt = -1e9;
const fx = [], parts = [], floats = [];
let flashAt = -1e9, lastFrameAt = 0, lastVideoTime = -1, frameNo = 0;
let frames = 0, lastFpsAt = performance.now(), fps = 0, handCount = 0;
let lastHandAt = 0, lastFaceAt = 0;

function showBanner(msg) { banner.textContent = msg; banner.hidden = false; }

// ---------- sound (made in the browser, no files) ----------
let actx = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!actx && AC) { try { actx = new AC(); } catch {} }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
function tone(type, f0, f1, dur, gain = 0.25, delay = 0) {
  if (!actx || !prefs.sound) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, gain, f0, f1, delay = 0) {
  if (!actx || !prefs.sound) return;
  const t = actx.currentTime + delay, n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), flt = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; flt.type = "lowpass"; flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(flt).connect(g).connect(actx.destination); s.start(t);
}
const sfx = {
  squish() { tone("sine", 520, 80, 0.2, 0.3); noise(0.12, 0.12, 900, 200); tone("sine", 140, 420, 0.16, 0.14, 0.28); },
  boom() { noise(0.45, 0.5, 2400, 120); tone("sine", 190, 36, 0.4, 0.45); tone("square", 90, 40, 0.18, 0.1); },
  eyes() { tone("triangle", 260, 980, 0.13, 0.25); tone("triangle", 300, 1100, 0.13, 0.25, 0.07); tone("sine", 700, 380, 0.5, 0.1, 0.2); },
  confetti() { noise(0.2, 0.2, 5000, 1500); for (let i = 0; i < 6; i++) tone("triangle", 900 + Math.random() * 1400, 700 + Math.random() * 900, 0.09, 0.1, 0.03 + i * 0.045); },
  miss() { tone("sine", 220, 160, 0.07, 0.08); },
  combo(n) { tone("sine", 660 * Math.pow(2, Math.min(n, 12) / 12), 660 * Math.pow(2, Math.min(n, 12) / 12), 0.12, 0.12, 0.12); },
};

// ---------- models ----------
async function loadModels() {
  const vision = await FilesetResolver.forVisionTasks("./assets/wasm");
  // Face models are tiny, so they run on the processor. That avoids a graphics bug some iPhones have.
  const face = path => FaceDetector.createFromOptions(vision, {
    baseOptions: { modelAssetPath: path, delegate: "CPU" }, runningMode: "VIDEO", minDetectionConfidence: 0.45,
  });
  const hand = delegate => HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "./assets/models/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4,
  });
  faceFull = await face("./assets/models/blaze_face_full_range.tflite");
  faceShort = await face("./assets/models/blaze_face_short_range.tflite");
  handDelegate = FORCE_CPU ? "CPU" : "GPU";
  try { handLandmarker = await hand(handDelegate); }
  catch (e) { console.warn("Fast hand tracking failed, using the processor", e); handDelegate = "CPU"; handLandmarker = await hand("CPU"); }
  // Animals and cars. If this model fails the game still runs on heads alone.
  try {
    objectDetector = await ObjectDetector.createFromOptions(vision, {
      baseOptions: { modelAssetPath: "./assets/models/efficientdet_lite0.tflite", delegate: "CPU" },
      runningMode: "VIDEO", scoreThreshold: 0.35, maxResults: 6, categoryAllowlist: Object.keys(OBJECT_KINDS),
    });
  } catch (e) { console.warn("Animal and car tracking did not load", e); objectDetector = null; }
}
const faceDetector = () => (facing === "user" && !TEST_SRC ? faceShort : faceFull);

// ---------- camera ----------
async function startCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  if (TEST_SRC) {
    const img = new Image(); img.src = TEST_SRC; await img.decode();
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext("2d"), paint = () => g.drawImage(img, 0, 0);
    paint(); setInterval(paint, 33);
    stream = c.captureStream(30); mirrored = false;
  } else {
    const base = { width: { ideal: 1280 }, height: { ideal: 720 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { ...base, facingMode: facing === "environment" ? { exact: "environment" } : "user" } });
    } catch {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, facingMode: facing } });
    }
    const real = stream.getVideoTracks()[0]?.getSettings?.().facingMode;
    mirrored = real ? real === "user" : true; // a laptop webcam reports nothing and faces the player
    if (real === "user" || real === "environment") facing = real;
  }
  video.srcObject = stream;
  video.classList.toggle("mirrored", mirrored);
  await video.play();
  lastVideoTime = -1; faces = []; objects = [];
}
let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }

function sizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
window.addEventListener("resize", sizeCanvas);

// The video fills the screen and crops the overflow. These map video pixels to screen points.
function cover() {
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  return { s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2, vw, vh };

        ctx.fillStyle = p.color; ctx.scale(1, Math.cos(age / 90 + p.rot)); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// The crush zone outline. The dead zones outside it are dimmed a touch so the player can see them.
function drawZone() {
  const z = zoneRect(), live = pinch.locked;
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.fillRect(0, 0, W, z.y); ctx.fillRect(0, z.y + z.h, W, H - z.y - z.h);
  ctx.fillRect(0, z.y, z.x, z.h); ctx.fillRect(z.x + z.w, z.y, W - z.x - z.w, z.h);
  ctx.strokeStyle = live ? "rgba(80,230,130,.7)" : "rgba(255,255,255,.35)"; ctx.lineWidth = 2;
  ctx.setLineDash([10, 8]); roundRect(z.x, z.y, z.w, z.h, 16); ctx.stroke(); ctx.setLineDash([]);
}
function draw(now, dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!video.videoWidth) return;
  for (let i = fx.length - 1; i >= 0; i--) if (now - fx[i].start > fx[i].dur) fx.splice(i, 1);

  ctx.save();
  if (mirrored) { ctx.translate(W, 0); ctx.scale(-1, 1); }
  for (const e of fx) if (e.type === "squish") drawSquish(e, now);
  for (const f of targets()) {
    const hd = box(f);
    ctx.strokeStyle = now < f.cooldownUntil ? YELLOW : KINDS[f.kind].color; ctx.lineWidth = 3;
    roundRect(hd.x, hd.y, hd.w, hd.h, Math.min(hd.w, hd.h) * 0.14); ctx.stroke();
  }
  for (const e of fx) { if (e.type === "blast") drawBlast(e, now); else if (e.type === "eyes") drawEyes(e, now); else if (e.type === "ring") drawRing(e, now); }
  drawParts(now, dt);
  if (pinch.hand) {
    const { thumb, index } = pinch.hand, col = pinch.closed ? YELLOW : "rgba(80,230,130,.95)";
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(thumb.x, thumb.y); ctx.lineTo(index.x, index.y); ctx.stroke();
    for (const p of [thumb, index]) { ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();

  drawZone();
  // labels and score pops are text, so they are drawn the right way round
  ctx.textAlign = "center"; ctx.lineJoin = "round";
  ctx.font = `800 12px -apple-system, "Helvetica Neue", sans-serif`;
  for (const o of objects) {
    const b = box(o), x = screenX(b.x + b.w / 2), y = Math.max(b.y - 7, 14);
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.7)"; ctx.strokeText(o.label.toUpperCase(), x, y);
    ctx.fillStyle = KINDS[o.kind].color; ctx.fillText(o.label.toUpperCase(), x, y);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const fl = floats[i], u = (now - fl.born) / fl.life;
    if (u > 1) { floats.splice(i, 1); continue; }
    const x = Math.max(70, Math.min(W - 70, screenX(fl.x))), y = Math.max(fl.y - 14 - 70 * easeOut(u), 190);
    ctx.globalAlpha = u > 0.65 ? 1 - (u - 0.65) / 0.35 : 1;
    const s = 0.7 + 0.3 * backOut(u / 0.2);
    ctx.font = `900 ${Math.round(40 * s)}px -apple-system, "Helvetica Neue", sans-serif`;
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.75)"; ctx.strokeText(fl.txt, x, y); ctx.fillStyle = "#fff"; ctx.fillText(fl.txt, x, y);
    if (fl.sub) {
      ctx.font = `800 14px -apple-system, "Helvetica Neue", sans-serif`;
      ctx.lineWidth = 4; ctx.strokeText(fl.sub, x, y + 20); ctx.fillStyle = YELLOW; ctx.fillText(fl.sub, x, y + 20);
    }
  }
  ctx.globalAlpha = 1;
  const fa = 1 - (now - flashAt) / 160;
  if (fa > 0) { ctx.fillStyle = `rgba(255,255,255,${0.42 * fa})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- hud ----------
let hudDay = "";
function renderHud(pop) {
  const d = today();
  ptsEl.textContent = fmt(d.pts);
  subEl.textContent = `Crushed today: ${fmt(d.heads)}`;
  hudDay = dayKey();
  if (pop) { ptsEl.classList.add("pop"); setTimeout(() => ptsEl.classList.remove("pop"), 140); }
}
function renderStartStats() {
  const d = today(), b = bestDay(), bits = [];
  if (d.pts) bits.push(`Today ${fmt(d.pts)} pts`, `Crushed today: ${fmt(d.heads)}`);
  if (b && b.key !== dayKey()) bits.push(`Best day ${fmt(b.pts)}`);
  $("startStats").textContent = bits.join("  ·  ");
}
function tickHud(now) {
  if (dayKey() !== hudDay) renderHud(false);
  const live = combo > 1 && now - lastHitAt < COMBO_WINDOW_MS;
  comboEl.hidden = !live; if (live) comboEl.textContent = `Combo x${combo}`;
  let hint = "";
  if (now - lastHitAt > 2500) {
    if (now - lastFaceAt > 1500) hint = "Find a head, a pet or a car";
    else if (now - lastHandAt > 2000) hint = otherHands ? "Bring your hand into the middle box" : "Hold your hand out in the middle of the view";
    else if (pinch.hand && !pinch.armed && !pinch.closed) hint = "Open your fingers, then pinch";
  }
  if (hintEl.textContent !== hint) hintEl.textContent = hint;
}

// ---------- loop ----------
function frame(now, force) {
  if (video.readyState < 2 || !video.videoWidth) return;
  const dt = Math.min((now - lastFrameAt) / 1000, 0.05); lastFrameAt = now;
  T = cover();
  if (force || video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime; frameNo++;
    // faces on odd frames, animals and cars on every fourth even frame, hands every frame
    if (frameNo % 2 || force) updateFaces(faceDetector().detectForVideo(video, now).detections, now);
    if (objectDetector && (frameNo % 4 === 0 || force)) updateObjects(objectDetector.detectForVideo(video, now).detections, now);
    updatePinch(readHands(handLandmarker.detectForVideo(video, now)), now);
    frames++;
  }
  glideObjects(now, dt);
  draw(now, dt);
  if (now - lastFpsAt > 1000) {
    fps = frames; frames = 0; lastFpsAt = now;
    debugEl.textContent = `${fps} fps · ${faces.length} face · ${objects.length} animal/car · ${handCount} hand${otherHands ? ` (${otherHands} ignored)` : ""} · ${handDelegate === "GPU" ? "fast" : "safe"}`;
    tickHud(now);
  }
}
function loop(token) {
  if (!running || token !== loopToken) return;
  try { frame(performance.now(), false); } catch (e) { console.error(e); }
  requestAnimationFrame(() => loop(token));
}
function run() { running = true; lastFrameAt = performance.now(); const t = ++loopToken; requestAnimationFrame(() => loop(t)); }

document.addEventListener("visibilitychange", async () => {
  if (!started) return;
  if (document.hidden) { running = false; return; }
  const tr = stream && stream.getVideoTracks()[0];
  try { if (!tr || tr.readyState !== "live") await startCamera(); else await video.play(); } catch (e) { showBanner("The camera stopped. Reload the page to start it again."); }
  keepAwake(); run();
});

// ---------- controls ----------
for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, e => e.preventDefault(), { passive: false });

const pillBtns = [...document.querySelectorAll("#pills button")];
function setFx(name) { prefs.fx = name; writeJSON(PREF_KEY, prefs); pillBtns.forEach(b => b.classList.toggle("on", b.dataset.fx === name)); }
pillBtns.forEach(b => b.addEventListener("click", () => { initAudio(); setFx(b.dataset.fx); }));
setFx(prefs.fx);

const soundBtn = $("sound");
const paintSound = () => soundBtn.classList.toggle("off", !prefs.sound);
soundBtn.addEventListener("click", () => { prefs.sound = !prefs.sound; writeJSON(PREF_KEY, prefs); paintSound(); initAudio(); if (prefs.sound) sfx.squish(); });
paintSound();

const flipBtn = $("flip");
flipBtn.addEventListener("click", async () => {
  facing = facing === "environment" ? "user" : "environment";
  flipBtn.disabled = true;
  try { await startCamera(); } catch (e) { showBanner("Could not switch cameras: " + e.message); } finally { flipBtn.disabled = false; }
});

// crush zone editor
const zoneEdit = $("zoneEdit"), zoneBox = $("zoneBox"), zoneLabel = $("zoneLabel");
const pct = v => `${Math.round(v * 100)}%`;
function paintZone() {
  const z = prefs.zone;
  Object.assign(zoneBox.style, { left: pct(z.left), top: pct(z.top), right: pct(z.right), bottom: pct(z.bottom) });
  zoneLabel.innerHTML = `Crush zone<small>Top ${pct(z.top)} · Bottom ${pct(z.bottom)}<br>Left ${pct(z.left)} · Right ${pct(z.right)}</small>`;
}
function openZone() { editingZone = true; paintZone(); zoneEdit.hidden = false; }
function closeZone() { editingZone = false; zoneEdit.hidden = true; writeJSON(PREF_KEY, prefs); }
$("zoneBtn").addEventListener("click", openZone);
$("zoneDone").addEventListener("click", closeZone);
$("zoneReset").addEventListener("click", () => { prefs.zone = { ...ZONE_DEFAULT }; paintZone(); });
for (const grip of zoneBox.querySelectorAll(".grip")) {
  grip.addEventListener("pointerdown", e => {
    e.preventDefault(); grip.setPointerCapture(e.pointerId);
    const edge = grip.dataset.edge, z = prefs.zone;
    const move = ev => {
      const fx = clamp01(ev.clientX / window.innerWidth), fy = clamp01(ev.clientY / window.innerHeight);
      // each edge stops where the zone would get thinner than ZONE_MIN
      if (edge === "top") z.top = Math.min(fy, 1 - z.bottom - ZONE_MIN);
      if (edge === "bottom") z.bottom = Math.min(1 - fy, 1 - z.top - ZONE_MIN);
      if (edge === "left") z.left = Math.min(fx, 1 - z.right - ZONE_MIN);
      if (edge === "right") z.right = Math.min(1 - fx, 1 - z.left - ZONE_MIN);
      for (const k of ["top", "bottom", "left", "right"]) z[k] = Math.round(Math.max(0, z[k]) * 100) / 100;
      paintZone();
    };
    const up = () => { grip.removeEventListener("pointermove", move); grip.removeEventListener("pointerup", up); grip.removeEventListener("pointercancel", up); writeJSON(PREF_KEY, prefs); };
    grip.addEventListener("pointermove", move); grip.addEventListener("pointerup", up); grip.addEventListener("pointercancel", up);
  });
}

// day sheet
const sheet = $("sheet"), resetBtn = $("resetDay"), trackBtn = $("trackMode");
function openSheet() {
  const list = $("days"); list.textContent = "";
  for (let i = 0; i < 7; i++) {
    const dt = new Date(); dt.setDate(dt.getDate() - i);
    const k = dayKey(dt), v = days[k] || { pts: 0, heads: 0 };
    const li = document.createElement("li"); if (i === 0) li.className = "today";
    const name = document.createElement("span"); name.textContent = i === 0 ? "Today" : i === 1 ? "Yesterday" : dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    const h = document.createElement("span"); h.className = "h"; h.textContent = heads(v.heads);
    const p = document.createElement("span"); p.className = "p"; p.textContent = fmt(v.pts);
    li.append(name, h, p); list.append(li);
  }
  const b = bestDay(), d = today();
  $("bestLine").textContent = b ? `Best day ${fmt(b.pts)} points. Longest combo today x${d.combo || 0}.` : "Crush a head, a pet or a car to put points on the board.";
  resetBtn.textContent = "Reset today"; resetBtn.dataset.armed = "";
  trackBtn.textContent = handDelegate === "GPU" ? "Tracking is fast" : "Tracking is safe";
  sheet.hidden = false;
}
$("score").addEventListener("click", openSheet);
$("closeSheet").addEventListener("click", () => { sheet.hidden = true; });
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.hidden = true; });
resetBtn.addEventListener("click", () => {
  if (!resetBtn.dataset.armed) { resetBtn.dataset.armed = "1"; resetBtn.textContent = "Tap again to wipe today"; return; }
  delete days[dayKey()]; saveDays(); combo = 0; renderHud(false); openSheet();
});
// Fast uses the graphics chip. Safe uses the processor, for phones where the hand dots land in the wrong place.
trackBtn.addEventListener("click", () => {
  const u = new URL(location.href);
  if (u.searchParams.has("cpu")) u.searchParams.delete("cpu"); else u.searchParams.set("cpu", "1");
  location.replace(u);
});

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true; initAudio();
  try {
    await startCamera();
    startScreen.remove(); sizeCanvas(); renderHud(false);
    started = true; keepAwake(); run();
  } catch (e) {
    startBtn.disabled = false; startBtn.textContent = "Try again";
    showBanner(e && e.name === "NotAllowedError"
      ? "The camera is blocked. In Safari, tap the aA button, then Website Settings, and set Camera to Allow. Then reload."
      : "Camera failed: " + (e && e.message ? e.message : e));
  }
});

// test hooks (used by the build checks, harmless in play)
window.HP = {
  tick: () => frame(performance.now(), true),
  state: () => ({ W, H, faces: faces.map(f => ({ ...box(f), eyes: f.eyes })), objects: objects.map(o => ({ ...box(o), kind: o.kind, label: o.label, moving: isMoving(o) })), zone: zoneRect(), locked: pinch.locked, otherHands, hand: pinch.hand, today: today(), combo, fx: fx.map(e => e.type), parts: parts.length, floats: floats.length, handDelegate, mirrored }),
  pinchAt: (x, y, axis = "y", t = performance.now()) => onPinch({ thumb: { x, y: y - (axis === "y" ? 4 : 0) }, index: { x: x + (axis === "x" ? 4 : 0), y: y + (axis === "y" ? 4 : 0) }, mid: { x, y }, size: 100, gap: 4 }, t),
  pause: () => { running = false; },
  fakeHit: () => scoreHit({ kind: "head", label: "head", x: W / 2 - 40, y: H / 2 - 50, w: 80, h: 100, eyes: [{ x: W / 2 - 16, y: H / 2 - 12 }, { x: W / 2 + 16, y: H / 2 - 12 }], cooldownUntil: 0, lastSeen: performance.now() }, "y", performance.now()),
  frameAt: t => frame(t, true),
  // feed made-up hands straight to the crusher picker: [{ x, y, size, gap }]
  hands: (list, t = performance.now()) => updatePinch(list.map(h => ({ thumb: { x: h.x, y: h.y - h.gap / 2 }, index: { x: h.x, y: h.y + h.gap / 2 }, mid: { x: h.x, y: h.y }, size: h.size || 100, gap: h.gap })), t),
  // feed made-up detections in camera pixels: [{ label, x, y, w, h }]
  objects: (list, t = performance.now()) => updateObjects(list.map(o => ({ boundingBox: { originX: o.x, originY: o.y, width: o.w, height: o.h }, categories: [{ categoryName: o.label, score: 0.9 }] })), t),
  glide: (t, dt) => glideObjects(t, dt),
  crusher: () => ({ locked: pinch.locked, hand: pinch.hand && pinch.hand.mid, armed: pinch.armed, closed: pinch.closed, otherHands }),
  setZone: z => { prefs.zone = Object.assign({}, ZONE_DEFAULT, z); },
  openZone, closeZone,
  setFx,
};

renderStartStats(); renderHud(false);
if (!TEST_SRC && !navigator.mediaDevices) {
  showBanner("This page has no camera access. Open it from an https link in Safari.");
  startBtn.textContent = "Camera unavailable";
} else {
  loadModels().then(() => { startBtn.disabled = false; startBtn.textContent = "Start"; })
    .catch(e => showBanner("The tracking models did not load: " + e.message));
}
</script>
</body>
