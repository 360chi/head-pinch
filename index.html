<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Head Pinch">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Head Pinch</title>
<style>
  :root {
    --red: #ff3b30; --yellow: #ffe14d; --ink: #0b0b0c; --paper: #ffffff;
    --glass: rgba(18,18,20,.55); --line: rgba(255,255,255,.18);
    --top: env(safe-area-inset-top, 0px); --bot: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    width: 100%; height: 100dvh; overflow: hidden; background: #000; color: #fff;
    touch-action: none; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Helvetica Neue", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; border: none; background: none; touch-action: manipulation; cursor: pointer; }

  #stage { position: fixed; inset: 0; }
  #stage.shake { animation: shake .28s linear; }
  @keyframes shake {
    0% { transform: translate(0,0); } 20% { transform: translate(-7px,4px); } 40% { transform: translate(6px,-5px); }
    60% { transform: translate(-4px,-3px); } 80% { transform: translate(3px,4px); } 100% { transform: translate(0,0); }
  }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  #cam.mirrored { transform: scaleX(-1); }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* score */
  #score {
    position: fixed; top: calc(var(--top) + 10px); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 0; padding: 4px 18px 8px;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
  }
  #pts { font-size: 54px; font-weight: 900; line-height: 1; letter-spacing: -1.5px; font-variant-numeric: tabular-nums; transition: transform .12s ease; }
  #pts.pop { transform: scale(1.28); }
  #sub { font-size: 13px; font-weight: 600; opacity: .85; margin-top: 3px; }
  #combo {
    position: fixed; top: calc(var(--top) + 96px); left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: var(--yellow); color: var(--ink); font-weight: 900; font-size: 18px;
    padding: 4px 12px; border-radius: 999px; box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #toast {
    position: fixed; left: 50%; top: 36%; z-index: 6; width: max-content; max-width: calc(100% - 36px);
    transform: translate(-50%, -50%) rotate(-3deg) scale(.4); opacity: 0; pointer-events: none;
    background: var(--yellow); color: var(--ink); text-align: center;
    font-size: 27px; font-weight: 900; line-height: 1.1; letter-spacing: -.5px;
    padding: 16px 22px; border-radius: 22px; box-shadow: 0 10px 34px rgba(0,0,0,.5);
    transition: transform .28s cubic-bezier(.2,1.5,.4,1), opacity .2s ease;
  }
  #toast.show { transform: translate(-50%, -50%) rotate(-3deg) scale(1); opacity: 1; }
  #debug {
    position: fixed; left: 10px; top: calc(var(--top) + 8px);
    color: rgba(255,255,255,.5); font-size: 10px; font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none;
  }

  /* bottom controls */
  #hint {
    position: fixed; left: 78px; right: 78px; bottom: calc(var(--bot) + 84px);
    text-align: center; font-size: 14px; font-weight: 700; line-height: 1.25;
    text-shadow: 0 1px 8px rgba(0,0,0,.9); pointer-events: none;
  }
  .round {
    position: fixed; bottom: calc(var(--bot) + 68px); width: 52px; height: 52px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    display: grid; place-items: center;
  }
  .round svg { width: 24px; height: 24px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #sound { left: 14px; } #flip { right: 14px; }
  #sound.off .wave { display: none; } #sound:not(.off) .mute { display: none; }
  #pills {
    position: fixed; left: 0; right: 0; bottom: calc(var(--bot) + 12px);
    display: flex; justify-content: center; flex-wrap: nowrap; gap: 5px; padding: 0 8px;
  }
  #pills button {
    padding: 10px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap;
    background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #pills button.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }

  /* day sheet */
  #sheet {
    position: fixed; inset: 0; z-index: 8; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-end; justify-content: center;
  }
  #sheetCard {
    width: 100%; max-width: 460px; background: #151517; border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(var(--bot) + 18px); border-top: 1px solid var(--line);
  }
  #sheetCard h2 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  #bestLine { font-size: 13px; opacity: .7; margin-bottom: 12px; }
  #days { list-style: none; display: grid; gap: 2px; margin-bottom: 14px; }
  #days li { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; font-variant-numeric: tabular-nums; }
  #days li.today { font-weight: 800; }
  #days .h { opacity: .65; } #days .p { min-width: 64px; text-align: right; }
  .sheetBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheetBtns button { padding: 13px 10px; border-radius: 14px; background: rgba(255,255,255,.1); font-size: 14px; font-weight: 700; }
  .sheetBtns #closeSheet { grid-column: 1 / -1; background: var(--paper); color: var(--ink); }

  /* start */
  #start {
    position: fixed; inset: 0; z-index: 10; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 30px 26px; text-align: center;
  }
  #start svg { width: 132px; height: 132px; }
  #start h1 { font-size: 46px; font-weight: 900; letter-spacing: -2px; line-height: .95; text-transform: uppercase; }
  #start h1 span { color: var(--red); }
  #start p { color: rgba(255,255,255,.72); font-size: 16px; line-height: 1.4; max-width: 300px; }
  #startStats { font-size: 14px; font-weight: 700; color: var(--yellow); min-height: 18px; }
  #startBtn { margin-top: 6px; padding: 17px 54px; border-radius: 999px; background: var(--red); color: #fff; font-size: 21px; font-weight: 800; }
  #startBtn:disabled { opacity: .45; }
  #banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b00020; color: #fff;
    font-size: 14px; line-height: 1.4; padding: calc(var(--top) + 12px) 16px 12px;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<button id="score" type="button" aria-label="Open today's points">
  <span id="pts">0</span>
  <span id="sub">Amount of head today: 0</span>
</button>
<div id="combo" hidden></div>
<div id="toast" role="status"></div>
<div id="debug"></div>

<div id="hint"></div>
<button id="sound" class="round" type="button" aria-label="Sound">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg>
</button>
<button id="flip" class="round" type="button" aria-label="Flip camera">
  <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>
</button>
<div id="pills">
  <button type="button" data-fx="squish">Squish</button>
  <button type="button" data-fx="boom">Explode</button>
  <button type="button" data-fx="eyes">Eyes</button>
  <button type="button" data-fx="confetti">Confetti</button>
  <button type="button" data-fx="mix">Mix</button>
</div>

<div id="sheet" hidden>
  <div id="sheetCard">
    <h2>Your week</h2>
    <div id="bestLine"></div>
    <ul id="days"></ul>
    <div class="sheetBtns">
      <button id="resetDay" type="button">Reset today</button>
      <button id="trackMode" type="button">Tracking</button>
      <button id="closeSheet" type="button">Back to pinching</button>
    </div>
  </div>
</div>

<div id="banner" hidden></div>

<div id="start">
  <svg viewBox="0 0 132 132" aria-hidden="true">
    <circle cx="66" cy="66" r="24" fill="none" stroke="#ff3b30" stroke-width="5"/>
    <circle cx="58" cy="62" r="3" fill="#fff"/><circle cx="74" cy="62" r="3" fill="#fff"/>
    <path d="M57 76q9 6 18 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <path d="M66 4v26M66 128v-26" stroke="#ffe14d" stroke-width="9" stroke-linecap="round"/>
    <path d="M56 22l10 10 10-10M56 110l10-10 10 10" fill="none" stroke="#ffe14d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Head <span>Pinch</span></h1>
  <p>Aim the back camera at somebody. Hold your other hand out in front of the lens and pinch their head.</p>
  <div id="startStats"></div>
  <button id="startBtn" type="button" disabled>Loading</button>
</div>

<script type="module">
import { FaceDetector, HandLandmarker, FilesetResolver } from "./assets/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const stage = $("stage"), video = $("cam"), canvas = $("overlay"), ctx = canvas.getContext("2d");
const ptsEl = $("pts"), subEl = $("sub"), comboEl = $("combo"), debugEl = $("debug"), hintEl = $("hint");
const banner = $("banner"), startScreen = $("start"), startBtn = $("startBtn");

const params = new URLSearchParams(location.search);
const FORCE_CPU = params.has("cpu");
const TEST_SRC = params.get("src"); // test only: play a still image as the camera

// ---------- tuning ----------
const PINCH_CLOSE = 0.30;      // finger gap under this share of hand size counts as closed
const PINCH_OPEN = 0.50;       // gap over this share re-arms the pinch
const FACE_PERSIST_MS = 900;   // a head stays pinchable this long after the hand covers it
const COOLDOWN_MS = 700;       // rest time before the same head scores again
const COMBO_WINDOW_MS = 4000;  // hits inside this window chain a combo
const BASE_POINTS = 100;
const FAR_RATIO = 0.16, LONG_RATIO = 0.08; // face width as a share of the short screen side
const LOT_OF_HEAD = [10, 25, 50, 100, 200]; // head counts in a day that fire the pop up
const LOT_LINE = "you got a lot of head today"; // Chi's line, keep it word for word

const RED = "#ff3b30", YELLOW = "#ffe14d";
const CONFETTI = ["#ff3b30", "#ffe14d", "#34c759", "#0a84ff", "#ff9f0a", "#bf5af2", "#ffffff"];

// ---------- saved state ----------
const DAY_KEY = "headpinch.days.v1", PREF_KEY = "headpinch.prefs.v1";
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch { return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let days = readJSON(DAY_KEY, {});
let prefs = Object.assign({ fx: "mix", sound: true }, readJSON(PREF_KEY, {}));

const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function today() {
  const k = dayKey();
  if (!days[k]) days[k] = { pts: 0, heads: 0, combo: 0 };
  return days[k];
}
function saveDays() {
  const keys = Object.keys(days).sort();
  while (keys.length > 120) delete days[keys.shift()];
  writeJSON(DAY_KEY, days);
}
function bestDay() {
  let best = null;
  for (const [k, v] of Object.entries(days)) if (v.pts > 0 && (!best || v.pts > best.pts)) best = { key: k, ...v };
  return best;
}
const fmt = n => Math.round(n).toLocaleString();
const heads = n => `${fmt(n)} ${n === 1 ? "head" : "heads"}`;

// ---------- game state ----------
let faceFull, faceShort, handLandmarker, handDelegate = "GPU";
let stream = null, facing = "environment", mirrored = false;
let started = false, running = false, loopToken = 0;
let W = 0, H = 0, DPR = 1, T = null;
let faces = [], nextFaceId = 1;
const pinch = { closed: false, armed: false, hand: null, lastSeen: 0 };
let combo = 0, lastHitAt = -1e9;
const fx = [], parts = [], floats = [];
let flashAt = -1e9, lastFrameAt = 0, lastVideoTime = -1, frameNo = 0;
let frames = 0, lastFpsAt = performance.now(), fps = 0, handCount = 0;
let lastHandAt = 0, lastFaceAt = 0;

function showBanner(msg) { banner.textContent = msg; banner.hidden = false; }

// ---------- sound (made in the browser, no files) ----------
let actx = null;
function initAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!actx && AC) { try { actx = new AC(); } catch {} }
  if (actx && actx.state === "suspended") actx.resume().catch(() => {});
}
function tone(type, f0, f1, dur, gain = 0.25, delay = 0) {
  if (!actx || !prefs.sound) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, gain, f0, f1, delay = 0) {
  if (!actx || !prefs.sound) return;
  const t = actx.currentTime + delay, n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), flt = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; flt.type = "lowpass"; flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(flt).connect(g).connect(actx.destination); s.start(t);
}
const sfx = {
  squish() { tone("sine", 520, 80, 0.2, 0.3); noise(0.12, 0.12, 900, 200); tone("sine", 140, 420, 0.16, 0.14, 0.28); },
  boom() { noise(0.45, 0.5, 2400, 120); tone("sine", 190, 36, 0.4, 0.45); tone("square", 90, 40, 0.18, 0.1); },
  eyes() { tone("triangle", 260, 980, 0.13, 0.25); tone("triangle", 300, 1100, 0.13, 0.25, 0.07); tone("sine", 700, 380, 0.5, 0.1, 0.2); },
  confetti() { noise(0.2, 0.2, 5000, 1500); for (let i = 0; i < 6; i++) tone("triangle", 900 + Math.random() * 1400, 700 + Math.random() * 900, 0.09, 0.1, 0.03 + i * 0.045); },
  miss() { tone("sine", 220, 160, 0.07, 0.08); },
  combo(n) { tone("sine", 660 * Math.pow(2, Math.min(n, 12) / 12), 660 * Math.pow(2, Math.min(n, 12) / 12), 0.12, 0.12, 0.12); },
};

// ---------- models ----------
async function loadModels() {
  const vision = await FilesetResolver.forVisionTasks("./assets/wasm");
  // Face models are tiny, so they run on the processor. That avoids a graphics bug some iPhones have.
  const face = path => FaceDetector.createFromOptions(vision, {
    baseOptions: { modelAssetPath: path, delegate: "CPU" }, runningMode: "VIDEO", minDetectionConfidence: 0.45,
  });
  const hand = delegate => HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: "./assets/models/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.4, minTrackingConfidence: 0.4,
  });
  faceFull = await face("./assets/models/blaze_face_full_range.tflite");
  faceShort = await face("./assets/models/blaze_face_short_range.tflite");
  handDelegate = FORCE_CPU ? "CPU" : "GPU";
  try { handLandmarker = await hand(handDelegate); }
  catch (e) { console.warn("Fast hand tracking failed, using the processor", e); handDelegate = "CPU"; handLandmarker = await hand("CPU"); }
}
const faceDetector = () => (facing === "user" && !TEST_SRC ? faceShort : faceFull);

// ---------- camera ----------
async function startCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  if (TEST_SRC) {
    const img = new Image(); img.src = TEST_SRC; await img.decode();
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    const g = c.getContext("2d"), paint = () => g.drawImage(img, 0, 0);
    paint(); setInterval(paint, 33);
    stream = c.captureStream(30); mirrored = false;
  } else {
    const base = { width: { ideal: 1280 }, height: { ideal: 720 } };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { ...base, facingMode: facing === "environment" ? { exact: "environment" } : "user" } });
    } catch {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { ...base, facingMode: facing } });
    }
    const real = stream.getVideoTracks()[0]?.getSettings?.().facingMode;
    mirrored = real ? real === "user" : true; // a laptop webcam reports nothing and faces the player
    if (real === "user" || real === "environment") facing = real;
  }
  video.srcObject = stream;
  video.classList.toggle("mirrored", mirrored);
  await video.play();
  lastVideoTime = -1; faces = [];
}
let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }

function sizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
window.addEventListener("resize", sizeCanvas);

// The video fills the screen and crops the overflow. These map video pixels to screen points.
function cover() {
  const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
  return { s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2, vw, vh };
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp01 = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const backOut = x => { const c = clamp01(x) - 1; return 1 + 2.7 * c * c * c + 1.7 * c * c; };
const screenX = x => (mirrored ? W - x : x);

// ---------- face tracking ----------
function updateFaces(dets, now) {
  for (const d of dets) {
    const b = d.boundingBox; if (!b) continue;
    const x = b.originX * T.s + T.ox, y = b.originY * T.s + T.oy, w = b.width * T.s, h = b.height * T.s;
    const kp = (d.keypoints || []).slice(0, 2).map(k => ({ x: k.x * T.vw * T.s + T.ox, y: k.y * T.vh * T.s + T.oy }));
    const eyes = kp.length === 2 ? kp : [{ x: x + w * 0.3, y: y + h * 0.38 }, { x: x + w * 0.7, y: y + h * 0.38 }];
    let best = null, bestD = Infinity;
    for (const f of faces) {
      const dd = Math.hypot(f.x + f.w / 2 - (x + w / 2), f.y + f.h / 2 - (y + h / 2));
      if (dd < bestD && dd < Math.max(f.w, w)) { best = f; bestD = dd; }
    }
    if (best) {
      const a = 0.6;
      best.x += (x - best.x) * a; best.y += (y - best.y) * a; best.w += (w - best.w) * a; best.h += (h - best.h) * a;
      best.eyes = eyes.map((e, i) => ({ x: best.eyes[i].x + (e.x - best.eyes[i].x) * a, y: best.eyes[i].y + (e.y - best.eyes[i].y) * a }));
      best.lastSeen = now;
    } else {
      faces.push({ x, y, w, h, eyes, lastSeen: now, cooldownUntil: 0, id: nextFaceId++ });
    }
  }
  faces = faces.filter(f => now - f.lastSeen < FACE_PERSIST_MS);
  if (faces.length) lastFaceAt = now;
}
// The face box runs brow to chin. The head box adds hair and ears, and it is the hit area.
const head = f => ({ x: f.x - f.w * 0.14, y: f.y - f.h * 0.42, w: f.w * 1.28, h: f.h * 1.56 });

// ---------- pinch ----------
function readHand(res) {
  const list = res.landmarks || []; handCount = list.length;
  let best = null;
  for (const lm of list) {
    const P = i => ({ x: lm[i].x * T.vw * T.s + T.ox, y: lm[i].y * T.vh * T.s + T.oy });
    const wrist = P(0), a = P(5), b = P(17), thumb = P(4), index = P(8);
    const size = Math.max(dist(wrist, a), dist(wrist, b), dist(a, b) * 1.6);
    // the biggest hand is the nearest one, so it is the player's
    if (!best || size > best.size) best = { thumb, index, size, gap: dist(thumb, index), mid: { x: (thumb.x + index.x) / 2, y: (thumb.y + index.y) / 2 } };
  }
  return best;
}
function updatePinch(hand, now) {
  pinch.hand = hand;
  if (!hand) { if (now - pinch.lastSeen > 300) { pinch.closed = false; pinch.armed = false; } return; }
  pinch.lastSeen = now; lastHandAt = now;
  const r = hand.gap / hand.size;
  if (r > PINCH_OPEN) { pinch.armed = true; pinch.closed = false; }
  else if (r < PINCH_CLOSE && !pinch.closed) {
    pinch.closed = true;
    if (pinch.armed) { pinch.armed = false; onPinch(hand, now); }
  }

sheet.addEventListener("click", e => { if (e.target === sheet) sheet.hidden = true; });
resetBtn.addEventListener("click", () => {
  if (!resetBtn.dataset.armed) { resetBtn.dataset.armed = "1"; resetBtn.textContent = "Tap again to wipe today"; return; }
  delete days[dayKey()]; saveDays(); combo = 0; renderHud(false); openSheet();
});
// Fast uses the graphics chip. Safe uses the processor, for phones where the hand dots land in the wrong place.
trackBtn.addEventListener("click", () => {
  const u = new URL(location.href);
  if (u.searchParams.has("cpu")) u.searchParams.delete("cpu"); else u.searchParams.set("cpu", "1");
  location.replace(u);
});

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true; initAudio();
  try {
    await startCamera();
    startScreen.remove(); sizeCanvas(); renderHud(false);
    started = true; keepAwake(); run();
  } catch (e) {
    startBtn.disabled = false; startBtn.textContent = "Try again";
    showBanner(e && e.name === "NotAllowedError"
      ? "The camera is blocked. In Safari, tap the aA button, then Website Settings, and set Camera to Allow. Then reload."
      : "Camera failed: " + (e && e.message ? e.message : e));
  }
});

// test hooks (used by the build checks, harmless in play)
window.HP = {
  tick: () => frame(performance.now(), true),
  state: () => ({ W, H, faces: faces.map(f => ({ ...head(f), eyes: f.eyes })), hand: pinch.hand, today: today(), combo, fx: fx.map(e => e.type), parts: parts.length, floats: floats.length, handDelegate, mirrored }),
  pinchAt: (x, y, axis = "y", t = performance.now()) => onPinch({ thumb: { x, y: y - (axis === "y" ? 4 : 0) }, index: { x: x + (axis === "x" ? 4 : 0), y: y + (axis === "y" ? 4 : 0) }, mid: { x, y }, size: 100, gap: 4 }, t),
  pause: () => { running = false; },
  fakeHit: () => scoreHit({ x: W / 2 - 40, y: H / 2 - 50, w: 80, h: 100, eyes: [{ x: W / 2 - 16, y: H / 2 - 12 }, { x: W / 2 + 16, y: H / 2 - 12 }], cooldownUntil: 0, lastSeen: performance.now() }, "y", performance.now()),
  frameAt: t => frame(t, true),
  setFx,
};

renderStartStats(); renderHud(false);
if (!TEST_SRC && !navigator.mediaDevices) {
  showBanner("This page has no camera access. Open it from an https link in Safari.");
  startBtn.textContent = "Camera unavailable";
} else {
  loadModels().then(() => { startBtn.disabled = false; startBtn.textContent = "Start"; })
    .catch(e => showBanner("The tracking models did not load: " + e.message));
}
</script>
</body>
</html>
